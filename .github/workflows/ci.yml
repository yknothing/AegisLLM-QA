name: QA Framework CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compatibility:
    name: Go 1.22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22.4'
          cache: true
      - name: Verify standalone module
        run: test "$(GOWORK=off GOFLAGS=-mod=readonly go list -m all)" = "github.com/yknothing/AegisLLM-QA"
      - name: Test
        run: GOWORK=off GOFLAGS=-mod=readonly go test -count=1 ./...

  quality:
    name: QA framework quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.5'
          cache: true
      - name: Race and randomized tests
        run: GOWORK=off GOFLAGS=-mod=readonly go test -race -shuffle=on -count=3 ./...
      - name: Vet
        run: GOWORK=off GOFLAGS=-mod=readonly go vet ./...
      - name: Format and diff
        run: |
          test -z "$(gofmt -l .)"
          git diff --check
